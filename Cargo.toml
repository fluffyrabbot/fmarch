[workspace]
resolver = "2"
members = [
    "crates/content_registry",
    "crates/identity",
    "crates/community",
    "crates/domain",
    "crates/eventstore",
    "crates/projections",
    "crates/caps",
    "crates/commands",
    "crates/operator_proof",
    "crates/game_platform",
    "crates/wire",
    "crates/api",
    "crates/operator_api",
    "crates/server",
    "crates/media",
]

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "tls-rustls-ring-native-roots",
] }
