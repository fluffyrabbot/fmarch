[package]
name = "membership_application"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
community_membership = { path = "../community_membership", version = "0.1.0" }
eventstore = { path = "../eventstore", version = "0.1.0" }
hmac = "0.12"
identity = { path = "../identity", version = "0.1.0" }
principal = { path = "../principal", version = "0.1.0" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { workspace = true, features = ["uuid", "json"] }
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
sqlx = { workspace = true, features = ["uuid", "json", "macros", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
