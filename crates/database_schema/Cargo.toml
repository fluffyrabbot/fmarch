[package]
name = "database_schema"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
sha2 = "0.10"
sqlx = { workspace = true, features = ["macros", "migrate", "uuid"] }
thiserror = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
