[package]
name = "identity"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
argon2 = "0.5"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chacha20poly1305 = "0.10"
community_membership = { path = "../community_membership", version = "0.1.0" }
eventstore = { path = "../eventstore", version = "0.1.0" }
futures-util = "0.3"
hmac = "0.12"
jsonwebtoken = "9"
object_store = { version = "0.14.1", default-features = false, features = ["aws"] }
principal = { path = "../principal", version = "0.1.0" }
profile_handle_index = { path = "../profile_handle_index", version = "0.1.0" }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { workspace = true, features = [
    "uuid",
    "json",
] }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"

[dev-dependencies]
serde_json = "1"
sqlx = { workspace = true, features = [
    "uuid",
    "json",
    "macros",
    "migrate",
] }
tempfile = "3"
