[package]
name = "server"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
default-run = "server"

[dependencies]
api = { path = "../api", version = "0.1.0" }
commands = { path = "../commands", version = "0.1.0" }
eventstore = { path = "../eventstore", version = "0.1.0" }
identity = { path = "../identity", version = "0.1.0" }
media = { path = "../media", version = "0.1.0" }
operator_api = { path = "../operator_api", version = "0.1.0" }
projections = { path = "../projections", version = "0.1.0" }
axum = "0.8"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "migrate",
] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
