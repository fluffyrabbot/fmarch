[package]
name = "server"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
default-run = "server"

[dependencies]
api = { path = "../api", version = "0.1.0" }
commands = { path = "../commands", version = "0.1.0" }
content_registry = { path = "../content_registry", version = "0.1.0" }
eventstore = { path = "../eventstore", version = "0.1.0" }
identity = { path = "../identity", version = "0.1.0" }
media = { path = "../media", version = "0.1.0" }
operator_api = { path = "../operator_api", version = "0.1.0" }
projections = { path = "../projections", version = "0.1.0" }
profile_application = { path = "../profile_application", version = "0.1.0" }
axum = "0.8"
serde_json = "1"
sqlx = { workspace = true, features = [
    "migrate",
    "macros",
] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
