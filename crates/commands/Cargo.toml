[package]
name = "commands"
version = "0.1.0"
edition.workspace = true
# Directory harness at tests/pipeline/; residual body still lives at
# tests/pipeline.rs and is include!'d — disable autotests so that file is not
# a second integration binary (cargo forbids tests/pipeline.rs + tests/pipeline/).
autotests = false

[[test]]
name = "pipeline"
path = "tests/pipeline/main.rs"

[[test]]
name = "runtime_cancellation"
path = "tests/runtime_cancellation.rs"

[[test]]
name = "action_submission_boundary"
path = "tests/action_submission_boundary.rs"

[dependencies]
caps = { path = "../caps" }
projections = { path = "../projections" }
eventstore = { path = "../eventstore" }
domain = { path = "../domain" }
game_platform = { path = "../game_platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "json",
    "macros",
    "migrate",
] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
libc = "0.2"
