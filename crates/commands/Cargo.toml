[package]
name = "commands"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
# Integration targets are declared explicitly so shared support files under
# tests/pipeline/ cannot become accidental standalone crates.
autotests = false

[[test]]
name = "pipeline"
path = "tests/pipeline/main.rs"

[[test]]
name = "semantic_audit"
path = "tests/semantic_audit/main.rs"

[[test]]
name = "runtime_cancellation"
path = "tests/runtime_cancellation.rs"

[[test]]
name = "action_submission_boundary"
path = "tests/action_submission_boundary.rs"

[[test]]
name = "host_prompt_resolution_boundary"
path = "tests/host_prompt_resolution_boundary.rs"

[[test]]
name = "day_runtime_boundary"
path = "tests/day_runtime_boundary.rs"

[dependencies]
caps = { path = "../caps", version = "0.1.0" }
content_reference = { path = "../content_reference", version = "0.1.0" }
content_registry = { path = "../content_registry", version = "0.1.0" }
projections = { path = "../projections", version = "0.1.0" }
eventstore = { path = "../eventstore", version = "0.1.0" }
domain = { path = "../domain", version = "0.1.0" }
game_platform = { path = "../game_platform", version = "0.1.0" }
game_persona_application = { path = "../game_persona_application", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { workspace = true, features = [
    "uuid",
    "json",
    "macros",
    "migrate",
] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
libc = "0.2"

[dev-dependencies]
operator_proof = { path = "../operator_proof", version = "0.1.0" }
identity = { path = "../identity", version = "0.1.0" }
