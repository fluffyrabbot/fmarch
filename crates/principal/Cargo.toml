[package]
name = "principal"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[features]
typescript = ["dep:ts-rs", "ts-rs/uuid-impl"]

[dependencies]
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "12", optional = true }
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[dev-dependencies]
serde_json = "1"
