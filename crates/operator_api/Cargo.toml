[package]
name = "operator_api"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
caps = { path = "../caps", version = "0.1.0" }
commands = { path = "../commands", version = "0.1.0" }
domain = { path = "../domain", version = "0.1.0" }
operator_proof = { path = "../operator_proof", version = "0.1.0" }
eventstore = { path = "../eventstore", version = "0.1.0" }
identity = { path = "../identity", version = "0.1.0" }
projections = { path = "../projections", version = "0.1.0" }
principal = { path = "../principal", version = "0.1.0" }
wire = { path = "../wire", version = "0.1.0" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { workspace = true }
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
sha2 = "0.10"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
