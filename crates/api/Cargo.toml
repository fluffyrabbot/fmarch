[package]
name = "api"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
caps = { path = "../caps", version = "0.1.0" }
attention = { path = "../attention", version = "0.1.0" }
social = { path = "../social", version = "0.1.0" }
trust_safety = { path = "../trust_safety", version = "0.1.0" }
content_reference = { path = "../content_reference", version = "0.1.0" }
commands = { path = "../commands", version = "0.1.0" }
community_membership = { path = "../community_membership", version = "0.1.0" }
content_registry = { path = "../content_registry", version = "0.1.0" }
database_schema = { path = "../database_schema", version = "0.1.0" }
domain = { path = "../domain", version = "0.1.0" }
eventstore = { path = "../eventstore", version = "0.1.0" }
game_platform = { path = "../game_platform", version = "0.1.0" }
forum = { path = "../forum", version = "0.1.0" }
identity = { path = "../identity", version = "0.1.0" }
media = { path = "../media", version = "0.1.0" }
membership_application = { path = "../membership_application", version = "0.1.0" }
projections = { path = "../projections", version = "0.1.0" }
profile_application = { path = "../profile_application", version = "0.1.0" }
principal = { path = "../principal", version = "0.1.0" }
wire = { path = "../wire", version = "0.1.0" }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
ciborium = "0.2"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { workspace = true }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
async-trait = "0.1"
futures-util = "0.3"
object_store = { version = "0.14.1", default-features = false }
png = "0.18"
sha2 = "0.10"
tempfile = "3"
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
