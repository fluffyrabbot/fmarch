[package]
name = "api"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
caps = { path = "../caps", version = "0.1.0" }
community = { path = "../community", version = "0.1.0" }
commands = { path = "../commands", version = "0.1.0" }
domain = { path = "../domain", version = "0.1.0" }
eventstore = { path = "../eventstore", version = "0.1.0" }
game_platform = { path = "../game_platform", version = "0.1.0" }
identity = { path = "../identity", version = "0.1.0" }
media = { path = "../media", version = "0.1.0" }
projections = { path = "../projections", version = "0.1.0" }
wire = { path = "../wire", version = "0.1.0" }
axum = { version = "0.8", features = ["ws"] }
ciborium = "0.2"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "postgres",
] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
futures-util = "0.3"
png = "0.18"
sha2 = "0.10"
tempfile = "3"
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
