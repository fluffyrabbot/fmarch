[package]
name = "operator_proof"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
caps = { path = "../caps", version = "0.1.0" }
commands = { path = "../commands", version = "0.1.0" }
domain = { path = "../domain", version = "0.1.0" }
eventstore = { path = "../eventstore", version = "0.1.0" }
projections = { path = "../projections", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "json",
    "macros",
    "migrate",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
