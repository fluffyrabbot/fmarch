[package]
name = "projections"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
attention = { path = "../attention", version = "0.1.0" }
social = { path = "../social", version = "0.1.0" }
trust_safety = { path = "../trust_safety", version = "0.1.0" }
forum = { path = "../forum", version = "0.1.0" }
content_reference = { path = "../content_reference", version = "0.1.0" }
content_registry = { path = "../content_registry", version = "0.1.0" }
domain = { path = "../domain", version = "0.1.0" }
eventstore = { path = "../eventstore", version = "0.1.0" }
game_platform = { path = "../game_platform", version = "0.1.0" }
identity = { path = "../identity", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { workspace = true, features = [
    "uuid",
    "json",
    "migrate",
] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
object_store = { version = "0.14.1", default-features = false }
tempfile = "3"
