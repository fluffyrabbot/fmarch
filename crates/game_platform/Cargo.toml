[package]
name = "game_platform"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[features]
typescript = ["dep:ts-rs", "domain/typescript"]

[dependencies]
blake3 = "1"
domain = { path = "../domain", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
ts-rs = { version = "12", optional = true }
uuid = { version = "1", features = ["v4", "serde"] }
