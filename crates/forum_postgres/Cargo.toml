[package]
name = "forum_postgres"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
content_reference = { path = "../content_reference", version = "0.1.0" }
event_actor = { path = "../event_actor", version = "0.1.0" }
eventstore = { path = "../eventstore", version = "0.1.0" }
forum = { path = "../forum", version = "0.1.0" }
forum_application = { path = "../forum_application", version = "0.1.0" }
forum_journal = { path = "../forum_journal", version = "0.1.0" }
identity = { path = "../identity", version = "0.1.0" }
membership_application = { path = "../membership_application", version = "0.1.0" }
principal = { path = "../principal", version = "0.1.0" }
profile_application = { path = "../profile_application", version = "0.1.0" }
projections = { path = "../projections", version = "0.1.0" }
serde_json = "1"
sqlx = { workspace = true, features = ["uuid", "json"] }
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
database_schema = { path = "../database_schema", version = "0.1.0" }
social = { path = "../social", version = "0.1.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
